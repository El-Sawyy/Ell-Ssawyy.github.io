<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DispatchPro - Nurse Dispatch Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-active { @apply bg-white shadow-sm text-indigo-700 border-slate-200; }
        .tab-inactive { @apply text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 border-transparent; }
        
        /* Custom scrollbar for tables */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .row-expanded { background-color: #f8fafc; border-bottom: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900 min-h-screen flex flex-col">

    <nav class="bg-white border-b border-slate-200 px-6 py-3 sticky top-0 z-20 flex justify-between items-center shadow-sm">
        <div class="flex items-center">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-3 shadow-indigo-200 shadow-md">
                <span class="text-white font-bold text-xl">D</span>
            </div>
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">Dispatch<span class="text-indigo-600 font-light">Pro</span></h1>
        </div>
        
        <div class="flex items-center space-x-4">
            <div id="sync-status" class="hidden items-center text-xs font-medium px-3 py-1 rounded-full bg-slate-100 text-slate-600 border border-slate-200">
                <i data-lucide="refresh-cw" class="w-3 h-3 mr-1.5 animate-spin"></i> Syncing...
            </div>
            <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200">
                <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-active border px-4 py-2 rounded-md text-sm font-medium transition-all flex items-center">
                    <i data-lucide="layout-dashboard" class="w-4 h-4 mr-2"></i>
                    Orders Dashboard
                </button>
                <button onclick="switchTab('schedule')" id="tab-schedule" class="tab-inactive border px-4 py-2 rounded-md text-sm font-medium transition-all flex items-center">
                    <i data-lucide="calendar-days" class="w-4 h-4 mr-2"></i>
                    Resource Planner
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-[1400px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow">
        
        <!-- ==================== DASHBOARD VIEW ==================== -->
        <div id="view-dashboard">
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6" id="kpi-container">
                <!-- Populated dynamically via JS -->
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col lg:flex-row gap-4 items-center justify-between">
                <div class="relative w-full lg:w-96">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="search" class="h-4 w-4 text-slate-400"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search by Order ID, Client, or Nurse..." class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg leading-5 bg-slate-50 hover:bg-white focus:bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors">
                </div>

                <div class="flex flex-wrap sm:flex-nowrap space-x-0 sm:space-x-3 gap-y-3 w-full lg:w-auto">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="map-pin" class="h-4 w-4 text-slate-400"></i>
                        </div>
                        <select id="cityFilter" class="block w-full pl-10 pr-8 py-2 border border-slate-300 rounded-lg text-sm bg-slate-50 hover:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 appearance-none transition-colors">
                            <option value="All">All Cities</option>
                            <option value="Riyadh">Riyadh</option>
                            <option value="Jeddah">Jeddah</option>
                            <option value="Dammam">Dammam</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
                            <i data-lucide="chevron-down" class="h-4 w-4 text-slate-400"></i>
                        </div>
                    </div>

                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="filter" class="h-4 w-4 text-slate-400"></i>
                        </div>
                        <select id="statusFilter" class="block w-full pl-10 pr-8 py-2 border border-slate-300 rounded-lg text-sm bg-slate-50 hover:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 appearance-none transition-colors">
                            <option value="All">All Statuses</option>
                            <option value="HC UNASSIGNED">Unassigned</option>
                            <option value="NURSE ASSIGNED">Assigned</option>
                            <option value="BROADCASTING">Broadcasting</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
                            <i data-lucide="chevron-down" class="h-4 w-4 text-slate-400"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8 flex flex-col">
                <div class="px-6 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center sticky left-0">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center">
                        <div class="w-8 h-8 rounded bg-indigo-100 flex items-center justify-center mr-3">
                            <i data-lucide="calendar" class="w-4 h-4 text-indigo-600"></i>
                        </div>
                        Today's Orders
                        <span id="today-count" class="ml-3 bg-slate-200 text-slate-700 py-0.5 px-2.5 rounded-full text-sm font-medium">0</span>
                    </h2>
                    <span id="today-date-display" class="text-sm font-medium text-slate-500"></span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-600">
                        <thead class="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="px-5 py-4 font-semibold w-32">Time & City</th>
                                <th class="px-5 py-4 font-semibold w-48">Order IDs</th>
                                <th class="px-5 py-4 font-semibold min-w-[180px]">Customer</th>
                                <th class="px-5 py-4 font-semibold min-w-[200px]">Package</th>
                                <th class="px-5 py-4 font-semibold min-w-[240px]">Status & Assignment</th>
                            </tr>
                        </thead>
                        <tbody id="today-table-body" class="divide-y divide-slate-100">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
                <div class="px-6 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center sticky left-0">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center">
                        <div class="w-8 h-8 rounded bg-slate-200 flex items-center justify-center mr-3">
                            <i data-lucide="calendar-days" class="w-4 h-4 text-slate-600"></i>
                        </div>
                        Future Orders (Next 14 Days)
                        <span id="future-count" class="ml-3 bg-slate-300 text-slate-800 py-0.5 px-2.5 rounded-full text-sm font-medium">0</span>
                    </h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-600">
                        <thead class="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="px-5 py-4 font-semibold w-32">Time & City</th>
                                <th class="px-5 py-4 font-semibold w-48">Order IDs</th>
                                <th class="px-5 py-4 font-semibold min-w-[180px]">Customer</th>
                                <th class="px-5 py-4 font-semibold min-w-[200px]">Package</th>
                                <th class="px-5 py-4 font-semibold min-w-[240px]">Status & Assignment</th>
                            </tr>
                        </thead>
                        <tbody id="future-table-body" class="divide-y divide-slate-100">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ==================== SCHEDULE VIEW ==================== -->
        <div id="view-schedule" class="hidden">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 min-h-[600px]">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center">
                        <div class="w-8 h-8 rounded bg-indigo-100 flex items-center justify-center mr-3">
                            <i data-lucide="users" class="w-4 h-4 text-indigo-600"></i>
                        </div>
                        Resource Planner & Availability
                    </h2>
                    <span id="schedule-date-display" class="text-sm font-medium px-3 py-1 bg-slate-100 text-slate-600 rounded-full border border-slate-200"></span>
                </div>
                
                <div class="mb-6 pb-4 border-b border-slate-100">
                    <p class="text-sm text-slate-500 mb-3">Filter schedule by City:</p>
                    <div class="flex space-x-2" id="schedule-city-filters">
                        <button onclick="setScheduleCity('All')" class="sched-btn active px-3 py-1.5 rounded text-sm font-medium bg-slate-800 text-white transition-colors">All Locations</button>
                        <button onclick="setScheduleCity('Riyadh')" class="sched-btn px-3 py-1.5 rounded text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">Riyadh</button>
                        <button onclick="setScheduleCity('Jeddah')" class="sched-btn px-3 py-1.5 rounded text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">Jeddah</button>
                        <button onclick="setScheduleCity('Dammam')" class="sched-btn px-3 py-1.5 rounded text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">Dammam</button>
                    </div>
                </div>

                <div id="schedule-container" class="space-y-4">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

    </main>

    <script>
        // ============================================================================
        // CONFIGURATION
        // ============================================================================
        const GOOGLE_SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbw7U5kFpY3p061Ozul2ivdr6p9vpF9u1xKp2nCk9IRJ_3bRZ6F-aNT3mPYpRsb1uM41/exec'; 

        // Global State
        let state = {
            allData: [],
            activeTab: 'dashboard',
            searchQuery: '',
            filterCity: 'All',
            filterStatus: 'All',
            scheduleCityFilter: 'All',
            expandedRows: new Set(),
            isLoading: true,
            error: null,
            todayString: '' 
        };

        const MASTER_NURSES = [
            { name: 'Jasmine Solano', city: 'Riyadh' },
            { name: 'Maria Clarissa', city: 'Riyadh' },
            { name: 'Nhar Sanapia', city: 'Riyadh' },
            { name: 'Fatima Zahra', city: 'Riyadh' },
            { name: 'Janice Garcia', city: 'Riyadh' },
            { name: 'Lilibeth Nortes', city: 'Jeddah' },
            { name: 'Salvacion', city: 'Jeddah' },
            { name: 'Sarah Ahmed', city: 'Jeddah' },
            { name: 'Honey Lane', city: 'Dammam' }
        ];

        function getTodayDateString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDisplayDate(dateStr) {
            if(!dateStr) return 'N/A';
            const d = new Date(dateStr);
            if(isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        // Initialize today's string on load
        state.todayString = getTodayDateString();
        document.getElementById('today-date-display').innerText = formatDisplayDate(state.todayString);
        document.getElementById('schedule-date-display').innerText = formatDisplayDate(state.todayString);

        // This completely bypasses CORS blocks by using a script tag injection
        window.handleGoogleData = function(data) {
            if (data && data.error) {
                handleSyncError(data.error);
                return;
            }
            
            state.allData = data || [];
            state.isLoading = false;
            state.error = null;
            
            document.getElementById('sync-status').classList.add('hidden');
            document.getElementById('sync-status').classList.remove('flex');
            
            updateUI();
        };

        function handleSyncError(displayError) {
            state.allData = [];
            state.isLoading = false;
            state.error = displayError;
            updateUI();

            document.getElementById('sync-status').classList.add('hidden');
            document.getElementById('sync-status').classList.remove('flex');

            const toast = document.createElement('div');
            toast.className = "fixed top-20 right-6 bg-red-600 text-white px-4 py-3 rounded-lg shadow-xl flex items-center z-50 transition-opacity duration-300";
            toast.innerHTML = `<i data-lucide="alert-triangle" class="w-5 h-5 text-red-200 mr-3"></i> <div><p class="font-bold text-sm">Connection Error</p><p class="text-xs text-red-100 max-w-xs">${displayError}</p></div>`;
            document.body.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=>toast.remove(), 300); }, 10000);
        }

        function fetchLiveOrders() {
            const syncIcon = document.getElementById('sync-status');
            syncIcon.classList.remove('hidden');
            syncIcon.classList.add('flex');

            if (state.isLoading) {
                const loadingHtml = `<tr><td colSpan="5" class="px-6 py-12 text-center">
                    <i data-lucide="loader-2" class="w-8 h-8 text-indigo-500 animate-spin mx-auto mb-3"></i>
                    <p class="text-slate-500 font-medium">Fetching secure data from Daily Dump...</p>
                </td></tr>`;
                document.getElementById('today-table-body').innerHTML = loadingHtml;
                document.getElementById('future-table-body').innerHTML = loadingHtml;
            }
            
            // Generate dynamic script tag for JSONP
            const script = document.createElement('script');
            script.src = `${GOOGLE_SHEET_API_URL}?callback=handleGoogleData&t=${new Date().getTime()}`;
            script.onerror = function() {
                handleSyncError("Network blocked the request. Check internet connection.");
            };
            document.body.appendChild(script);
            
            // Clean up after load
            script.onload = function() {
                document.body.removeChild(script);
            };
        }

        function getStatusBadge(status) {
            const s = String(status || '').toUpperCase();
            let color = 'bg-slate-100 text-slate-700 border-slate-200';
            let icon = 'help-circle';

            if (s.includes('NURSE ASSIGNED')) { color = 'bg-emerald-100 text-emerald-800 border-emerald-200'; icon = 'check-circle-2'; }
            else if (s.includes('UNASSIGNED')) { color = 'bg-rose-100 text-rose-800 border-rose-200'; icon = 'alert-circle'; }
            else if (s.includes('BROADCAST')) { color = 'bg-amber-100 text-amber-800 border-amber-200'; icon = 'radio'; }
            else if (s.includes('COMPLETED')) { color = 'bg-blue-100 text-blue-800 border-blue-200'; icon = 'check-check'; }

            return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-bold border ${color} shadow-sm uppercase tracking-wide">
                <i data-lucide="${icon}" class="w-3 h-3 mr-1.5"></i>${s || 'UNKNOWN'}
            </span>`;
        }

        function getBookingBadge(type) {
            const t = String(type || '').toLowerCase();
            let color = 'bg-slate-100 text-slate-600 border border-slate-200';
            if (t.includes('daily')) color = 'bg-sky-50 text-sky-700 border border-sky-200';
            if (t.includes('monthly')) color = 'bg-fuchsia-50 text-fuchsia-700 border border-fuchsia-200';
            if (t.includes('weekly')) color = 'bg-teal-50 text-teal-700 border border-teal-200';
            return `<span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wide uppercase ${color}">${String(type) || 'N/A'}</span>`;
        }

        function buildTableRow(order, isTodayView) {
            const s = String(order.order_status || '').toUpperCase();
            const needsAssign = s.includes('UNASSIGNED') || s.includes('BROADCAST');
            const bgClass = needsAssign ? 'bg-rose-50/40 hover:bg-rose-50/70' : 'hover:bg-slate-50';
            
            // Nurse Cell Logic
            let nurseCell = '';
            if (s.includes('NURSE ASSIGNED') && order.nurse_name) {
                nurseCell = `
                    <div class="flex items-center text-slate-800 text-xs font-medium bg-white px-2.5 py-1.5 rounded border border-slate-200 shadow-sm w-fit mt-2">
                        <div class="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center mr-2 text-[10px] font-bold">
                            ${String(order.nurse_name).charAt(0)}
                        </div>
                        <span class="truncate max-w-[150px]">${order.nurse_name}</span>
                    </div>`;
            } else {
                const cityNurses = MASTER_NURSES.filter(n => n.city.toLowerCase() === String(order.city||'').toLowerCase());
                const options = cityNurses.map(n => `<option value="${n.name}">${n.name}</option>`).join('');
                nurseCell = `
                    <select onchange="assignNurseLocal(${order.id}, this.value)" class="mt-2 bg-white border-2 border-indigo-200 text-slate-900 text-[11px] rounded focus:ring-indigo-500 focus:border-indigo-500 block w-full p-1.5 font-medium shadow-sm cursor-pointer hover:border-indigo-300 transition-colors">
                        <option value="" selected disabled>+ Assign Nurse...</option>
                        ${options}
                        <option disabled>────────</option>
                        <option value="custom">Manual Entry...</option>
                    </select>`;
            }

            // New Layout Columns
            let timeCityCol = `
                <div class="font-bold text-slate-900 text-sm">${order.confirmed_hour || '--:--'}</div>
                ${!isTodayView ? `<div class="text-[10px] text-slate-500 font-medium uppercase mt-0.5">${formatDisplayDate(order.confirmed_date)}</div>` : ''}
                <div class="flex items-center font-medium text-slate-600 mt-1 text-[11px]">
                    <i data-lucide="map-pin" class="w-3 h-3 mr-1 text-slate-400"></i>${order.city || '-'}
                </div>
            `;

            let idsCol = `
                <div class="font-mono text-[10px] text-slate-700 mb-1 leading-tight break-all">
                    <span class="text-slate-400 font-sans mr-1">UUID:</span><br>${order.order_uuid}
                </div>
                ${order.child_order_id ? `<div class="font-mono text-[10px] text-slate-500 mt-1"><span class="text-slate-400 font-sans mr-1">Child:</span>${order.child_order_id}</div>` : ''}
            `;

            let rowHtml = `
                <tr class="transition-colors border-b border-slate-100 ${bgClass}">
                    <td class="px-5 py-4 whitespace-nowrap align-top">${timeCityCol}</td>
                    <td class="px-5 py-4 align-top w-48">${idsCol}</td>
                    <td class="px-5 py-4 align-top">
                        <div class="font-bold text-slate-900 text-sm mb-1 line-clamp-1" title="${order.user_name}">${order.user_name || 'No Name'}</div>
                        <div class="text-[11px] text-slate-500 flex items-center font-medium mb-1.5">
                            <i data-lucide="phone" class="w-2.5 h-2.5 mr-1 text-slate-400"></i>${order.phone_number || 'No Phone'}
                        </div>
                        ${getBookingBadge(order.booking_type)}
                    </td>
                    <td class="px-5 py-4 align-top">
                        <div class="text-[12px] text-slate-700 font-medium leading-relaxed line-clamp-3" title="${order.package_name}">${order.package_name || '-'}</div>
                    </td>
                    <td class="px-5 py-4 align-top">
                        <div class="flex items-center space-x-2 flex-wrap gap-y-2">
                            ${getStatusBadge(order.order_status)}
                            ${parseInt(order.delay_mins) > 0 ? `<div class="text-[10px] text-rose-600 font-bold bg-rose-100/50 px-2 py-0.5 rounded inline-block whitespace-nowrap">Delayed: ${order.delay_mins}m</div>` : ''}
                        </div>
                        ${nurseCell}
                        ${order.b2b_partner ? `<div class="text-[10px] text-slate-400 mt-2 flex items-center uppercase tracking-wide"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>${order.b2b_partner}</div>` : ''}
                    </td>
                </tr>
            `;
            return rowHtml;
        }

        function updateUI() {
            if (state.isLoading) return;

            // 1. Apply Filters
            const searchLower = String(state.searchQuery).toLowerCase();
            let filtered = state.allData.filter(order => {
                const mSearch = String(order.user_name || '').toLowerCase().includes(searchLower) || 
                                String(order.order_uuid || '').toLowerCase().includes(searchLower) ||
                                String(order.child_order_id || '').toLowerCase().includes(searchLower) ||
                                String(order.nurse_name || '').toLowerCase().includes(searchLower);
                const mCity = state.filterCity === 'All' || String(order.city) === state.filterCity;
                const mStat = state.filterStatus === 'All' || String(order.order_status||'').includes(state.filterStatus);
                return mSearch && mCity && mStat;
            });

            // 2. Split Arrays
            const todaysOrders = filtered.filter(o => String(o.confirmed_date) === state.todayString);
            const futureOrders = filtered.filter(o => String(o.confirmed_date) !== state.todayString);

            // 3. Sorting
            const sortByTime = (a, b) => String(a.confirmed_hour || '').localeCompare(String(b.confirmed_hour || ''));
            todaysOrders.sort(sortByTime);
            
            const sortByDateTime = (a, b) => {
                const dateCmp = String(a.confirmed_date || '').localeCompare(String(b.confirmed_date || ''));
                if (dateCmp !== 0) return dateCmp;
                return sortByTime(a, b);
            };
            futureOrders.sort(sortByDateTime);

            // 4. Update KPI metrics
            const unassignedCount = todaysOrders.filter(o => {
                const s = String(o.order_status||'').toUpperCase();
                return s.includes('UNASSIGNED') || s.includes('BROADCAST');
            }).length;
            
            const delayedCount = todaysOrders.filter(o => parseInt(o.delay_mins) > 30).length;
            const activeNurses = new Set(todaysOrders.filter(o => o.nurse_name).map(o => o.nurse_name)).size;

            document.getElementById('kpi-container').innerHTML = `
                <div class="bg-white rounded-xl p-5 border-l-4 border-l-blue-500 border-y border-r border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Today's Volume</p>
                        <p class="text-3xl font-black text-slate-800 mt-1">${todaysOrders.length}</p>
                    </div>
                    <div class="rounded-full bg-blue-50 p-3"><i data-lucide="bar-chart-2" class="w-6 h-6 text-blue-500"></i></div>
                </div>
                
                <div class="bg-white rounded-xl p-5 border-l-4 border-l-rose-500 border-y border-r border-slate-200 shadow-sm flex items-center justify-between relative overflow-hidden">
                    ${unassignedCount > 0 ? '<div class="absolute top-0 right-0 w-10 h-10 bg-rose-100 rounded-bl-full flex items-start justify-end pr-2 pt-2"><span class="flex h-2.5 w-2.5 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span></span></div>' : ''}
                    <div>
                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Action Needed</p>
                        <div class="flex items-baseline space-x-2 mt-1">
                            <p class="text-3xl font-black ${unassignedCount > 0 ? 'text-rose-600' : 'text-slate-800'}">${unassignedCount}</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Unassigned</p>
                        </div>
                    </div>
                    <div class="rounded-full bg-rose-50 p-3"><i data-lucide="alert-triangle" class="w-6 h-6 text-rose-500"></i></div>
                </div>

                <div class="bg-white rounded-xl p-5 border-l-4 border-l-amber-500 border-y border-r border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Delayed (>30m)</p>
                        <p class="text-3xl font-black ${delayedCount > 0 ? 'text-amber-600' : 'text-slate-800'} mt-1">${delayedCount}</p>
                    </div>
                    <div class="rounded-full bg-amber-50 p-3"><i data-lucide="clock-8" class="w-6 h-6 text-amber-500"></i></div>
                </div>

                <div class="bg-white rounded-xl p-5 border-l-4 border-l-emerald-500 border-y border-r border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Deployed Nurses</p>
                        <p class="text-3xl font-black text-slate-800 mt-1">${activeNurses}</p>
                    </div>
                    <div class="rounded-full bg-emerald-50 p-3"><i data-lucide="user-check" class="w-6 h-6 text-emerald-500"></i></div>
                </div>
            `;

            // 5. Render Tables
            const renderTable = (dataArr, tableId, isToday) => {
                const tbody = document.getElementById(tableId);
                if(dataArr.length === 0) {
                    tbody.innerHTML = `<tr><td colSpan="5" class="px-6 py-12 text-center text-slate-400 font-medium bg-slate-50/50">No orders found matching criteria.</td></tr>`;
                } else {
                    tbody.innerHTML = dataArr.map(o => buildTableRow(o, isToday)).join('');
                }
            };

            renderTable(todaysOrders, 'today-table-body', true);
            renderTable(futureOrders, 'future-table-body', false);
            
            document.getElementById('today-count').innerText = todaysOrders.length;
            document.getElementById('future-count').innerText = futureOrders.length;

            if(state.activeTab === 'schedule') {
                renderSchedule(todaysOrders);
            }

            lucide.createIcons();
        }

        function renderSchedule(todaysOrders) {
            const container = document.getElementById('schedule-container');
            
            let allNursesMap = new Map();
            MASTER_NURSES.forEach(n => allNursesMap.set(n.name, n.city));
            todaysOrders.forEach(o => {
                if(o.nurse_name && !allNursesMap.has(o.nurse_name)) {
                    allNursesMap.set(o.nurse_name, o.city || 'Unknown');
                }
            });

            let nursesList = Array.from(allNursesMap, ([name, city]) => ({ name, city }));

            if(state.scheduleCityFilter !== 'All') {
                nursesList = nursesList.filter(n => n.city === state.scheduleCityFilter);
            }

            if(nursesList.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-500">No nurses found for this location.</div>`;
                return;
            }

            let html = '';
            
            // Sort nurses: Occupied first
            nursesList.sort((a, b) => {
                const aOrders = todaysOrders.filter(o => String(o.nurse_name) === a.name).length;
                const bOrders = todaysOrders.filter(o => String(o.nurse_name) === b.name).length;
                return bOrders - aOrders;
            });

            nursesList.forEach(nurse => {
                const nurseOrders = todaysOrders.filter(o => String(o.nurse_name) === nurse.name);
                const isOccupied = nurseOrders.length > 0;
                
                let orderCards = '';
                if(isOccupied) {
                    nurseOrders.forEach(o => {
                        orderCards += `
                            <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-3 text-sm flex-1 min-w-[220px] shadow-sm relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-500"></div>
                                <div class="flex justify-between items-start mb-1.5 pl-2">
                                    <span class="font-black text-indigo-900">${o.confirmed_hour}</span>
                                    ${getBookingBadge(o.booking_type)}
                                </div>
                                <div class="pl-2">
                                    <div class="font-bold text-slate-800 text-xs truncate">${o.user_name}</div>
                                    <div class="text-[10px] text-slate-500 mt-1 truncate font-medium" title="${o.package_name}">${o.package_name}</div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    orderCards = `
                        <div class="flex items-center justify-center text-emerald-600 bg-emerald-50/50 px-4 py-3 rounded-lg border border-emerald-200 border-dashed w-full h-full min-h-[80px]">
                            <i data-lucide="check-circle-2" class="w-4 h-4 mr-2"></i>
                            <span class="text-sm font-semibold">Available for Dispatch Today</span>
                        </div>
                    `;
                }

                html += `
                    <div class="flex flex-col lg:flex-row gap-6 p-5 border border-slate-200 rounded-xl bg-white hover:border-indigo-200 transition-colors shadow-sm">
                        <div class="w-full lg:w-64 shrink-0 flex items-center lg:items-start lg:border-r border-slate-100 pr-4">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 text-white flex items-center justify-center font-black text-lg mr-4 shadow-md shrink-0">
                                ${nurse.name.charAt(0)}
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900 text-sm">${nurse.name}</h3>
                                <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mt-0.5 flex items-center">
                                    <i data-lucide="map-pin" class="w-2.5 h-2.5 mr-1"></i> ${nurse.city}
                                </p>
                                <div class="mt-2">
                                    ${isOccupied 
                                        ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800 uppercase tracking-wide"><i data-lucide="clock" class="w-2.5 h-2.5 mr-1"></i> ${nurseOrders.length} Shift(s)</span>`
                                        : `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 uppercase tracking-wide">Ready</span>`
                                    }
                                </div>
                            </div>
                        </div>
                        <div class="w-full flex flex-wrap gap-3 items-stretch content-start">
                            ${orderCards}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.switchTab = function(tabName) {
            state.activeTab = tabName;
            
            document.getElementById('view-dashboard').classList.toggle('hidden', tabName !== 'dashboard');
            document.getElementById('view-schedule').classList.toggle('hidden', tabName !== 'schedule');
            
            const tDash = document.getElementById('tab-dashboard');
            const tSched = document.getElementById('tab-schedule');
            
            if(tabName === 'dashboard') {
                tDash.className = "tab-active border px-4 py-2 rounded-md text-sm font-medium transition-all flex items-center";
                tSched.className = "tab-inactive border px-4 py-2 rounded-md text-sm font-medium transition-all flex items-center";
            } else {
                tDash.className = "tab-inactive border px-4 py-2 rounded-md text-sm font-medium transition-all flex items-center";
                tSched.className = "tab-active border px-4 py-2 rounded-md text-sm font-medium transition-all flex items-center";
            }
            updateUI();
        };

        window.setScheduleCity = function(city) {
            state.scheduleCityFilter = city;
            const btns = document.querySelectorAll('.sched-btn');
            btns.forEach(b => {
                if(b.innerText.includes(city === 'All' ? 'All' : city)) {
                    b.className = "sched-btn active px-3 py-1.5 rounded text-sm font-medium bg-slate-800 text-white transition-colors";
                } else {
                    b.className = "sched-btn px-3 py-1.5 rounded text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors";
                }
            });
            updateUI();
        }

        window.assignNurseLocal = function(orderId, nurseName) {
            if (!nurseName) return;
            if (nurseName === 'custom') {
                const name = prompt("Enter manual nurse name:");
                if(!name) return;
                nurseName = name;
            }
            
            state.allData = state.allData.map(order => 
                order.id === orderId 
                    ? { ...order, nurse_name: nurseName, order_status: 'NURSE ASSIGNED', delay_mins: 0 } 
                    : order
            );
            
            const toast = document.createElement('div');
            toast.className = "fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-xl flex items-center z-50 transition-opacity duration-300";
            toast.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5 text-emerald-400 mr-3"></i> <div><p class="font-bold text-sm">Assigned Locally</p><p class="text-xs text-slate-300">Update Google Sheet to save permanently.</p></div>`;
            document.body.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=>toast.remove(), 300); }, 4000);
            updateUI();
        };

        // UI Listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            updateUI();
        });
        document.getElementById('cityFilter').addEventListener('change', (e) => {
            state.filterCity = e.target.value;
            updateUI();
        });
        document.getElementById('statusFilter').addEventListener('change', (e) => {
            state.filterStatus = e.target.value;
            updateUI();
        });

        // Initialize App
        lucide.createIcons();
        fetchLiveOrders(); 
        
        // Auto-refresh every 3 minutes to keep up with incoming dump orders
        setInterval(fetchLiveOrders, 180000);

    </script>
</body>
</html>
